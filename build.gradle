import net.fabricmc.loom.task.GenerateSourcesTask

plugins {
    id 'base'
    id 'fabric-loom' version '1.11-SNAPSHOT' apply false
}

allprojects {
    group = project.maven_group

    repositories {
        mavenCentral()
        maven { url 'https://maven.fabricmc.net/' }
        maven { url "https://repo.opencollab.dev/main/" }
    }
}

subprojects {
    version = findProperty("mod_version")

    plugins.withId('java') {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(21)
            }
            withSourcesJar()
        }

        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
            options.release = 21
        }

        dependencies {
            testImplementation platform("org.junit:junit-bom:5.10.0")
            testImplementation "org.junit.jupiter:junit-jupiter"
            testRuntimeOnly "org.junit.platform:junit-platform-launcher"
        }

        test { useJUnitPlatform() }
    }

    plugins.withId('fabric-loom') {
        // Materialize to plain strings at configuration time (no closures!)
        final String _version       = project.version.toString()
        final String _mcVersion     = project.findProperty('minecraft_version') as String
        final String _loaderVersion = project.findProperty('loader_version') as String
        final String _fabricVersion = project.findProperty('fabric_version') as String

        dependencies {
            minecraft "com.mojang:minecraft:${_mcVersion}"
            mappings  "net.fabricmc:yarn:${project.yarn_mappings}:v2"
            modImplementation "net.fabricmc:fabric-loader:${_loaderVersion}"
            modImplementation "net.fabricmc.fabric-api:fabric-api:${_fabricVersion}"
        }

        tasks.named('processResources', Copy) {
            // Inputs are plain strings
            inputs.properties(
                version:            _version,
                minecraft_version:  _mcVersion,
                loader_version:     _loaderVersion,
                fabric_version:     _fabricVersion
            )
            filteringCharset 'UTF-8'

            filesMatching('fabric.mod.json') {
                // expand with plain strings only
                expand(
                    version:           _version,
                    minecraft_version: _mcVersion,
                    loader_version:    _loaderVersion,
                    fabric_version:    _fabricVersion
                )
            }
        }
    }

}