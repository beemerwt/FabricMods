import net.fabricmc.loom.task.GenerateSourcesTask

plugins {
    id 'base'
    id 'fabric-loom' version '1.11-SNAPSHOT' apply false
}

allprojects {
    group = 'com.github.beemerwt'

    repositories {
        mavenCentral()
        maven { url 'https://maven.fabricmc.net/' }
        maven { url "https://repo.opencollab.dev/main/" }
    }
}

subprojects {
    plugins.withId('java') {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(21)
            }
            withSourcesJar()
        }

        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
            options.release = 21
        }

        dependencies {
            testImplementation platform("org.junit:junit-bom:5.10.0")
            testImplementation "org.junit.jupiter:junit-jupiter"
            testRuntimeOnly "org.junit.platform:junit-platform-launcher"
        }

        test { useJUnitPlatform() }
    }

    plugins.withId('fabric-loom') {
        // Capture values NOW, as plain strings (cache-safe)
        def _version            = "${project.version}"
        def _mcVersion          = "${project.minecraft_version}"
        def _loaderVersion      = "${project.loader_version}"
        def _fabricVersion      = "${project.fabric_version}"

        dependencies {
            minecraft "com.mojang:minecraft:${_mcVersion}"
            mappings  "net.fabricmc:yarn:${project.yarn_mappings}:v2"
            modImplementation "net.fabricmc:fabric-loader:${_loaderVersion}"
            modImplementation "net.fabricmc.fabric-api:fabric-api:${_fabricVersion}"
        }

        processResources {
            // use the captured strings; don't read from `project` in the closure
            inputs.property 'version',            _version
            inputs.property 'minecraft_version',  _mcVersion
            inputs.property 'loader_version',     _loaderVersion
            inputs.property 'fabric_version',     _fabricVersion
            filteringCharset 'UTF-8'

            filesMatching('fabric.mod.json') {
                expand(
                    version:           _version,
                    minecraft_version: _mcVersion,
                    loader_version:    _loaderVersion,
                    fabric_version:    _fabricVersion
                )
            }
        }
    }
}